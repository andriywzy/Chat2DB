stages:
  - build
  - deploy

variables:
  APP_NAME: "chat2db"
  APP_PORT: "10824"
  IMAGE_NAME: "chat2db-dev"
  DATA_DIR: "/opt/chat2db/data"
  DOCKER_BUILDKIT: "1"
  NODE_BASE_IMAGE: "node:16-bullseye"
  MAVEN_BASE_IMAGE: "maven:3.9-eclipse-temurin-17"
  RUNTIME_BASE_IMAGE: "eclipse-temurin:17-jre"
  GIT_STRATEGY: clone
  GIT_DEPTH: 0
build_image:
  stage: build
  tags:
    - chat2db
    - dev
  only:
    - dev
  script:
    - mkdir -p "${DATA_DIR}"
    - docker build -f docker/Dockerfile -t "${IMAGE_NAME}:${CI_COMMIT_SHA}" -t "${IMAGE_NAME}:latest" --build-arg APP_VERSION="${CI_COMMIT_SHORT_SHA}" --build-arg APP_PORT="${APP_PORT}" --build-arg NODE_BASE_IMAGE="${NODE_BASE_IMAGE}" --build-arg MAVEN_BASE_IMAGE="${MAVEN_BASE_IMAGE}" --build-arg RUNTIME_BASE_IMAGE="${RUNTIME_BASE_IMAGE}" .

deploy_chat2db:
  stage: deploy
  tags:
    - chat2db
    - dev
  only:
    - dev
  needs:
    - build_image
  script:
    - docker rm -f "${APP_NAME}" || true
    - docker run -d --name "${APP_NAME}" --restart unless-stopped -p "${APP_PORT}:10824" -v "${DATA_DIR}:/root/.chat2db" "${IMAGE_NAME}:latest"
    - docker ps --filter "name=${APP_NAME}"
    - curl -I -s "http://127.0.0.1:${APP_PORT}/login"
