services:
  chat2db:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_VERSION: ${CHAT2DB_TAG:-local}
        APP_PORT: ${CHAT2DB_PORT:-10824}
    image: chat2db/chat2db:${CHAT2DB_TAG:-local}
    container_name: chat2db
    restart: unless-stopped
    depends_on:
      - chat2db-gateway
    environment:
      CHAT2DB_GATEWAY_BASE_URL: ${CHAT2DB_GATEWAY_BASE_URL:-http://chat2db-gateway:18080}
      CHAT2DB_GATEWAY_MODEL_BASE_URL: ${CHAT2DB_GATEWAY_MODEL_BASE_URL:-http://chat2db-gateway:18080}
    ports:
      - "${CHAT2DB_PORT:-10824}:10824"
    volumes:
      - ${CHAT2DB_DATA_DIR:-${HOME}/.chat2db-docker}:/root/.chat2db

  chat2db-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    image: chat2db/chat2db-gateway:${CHAT2DB_TAG:-local}
    container_name: chat2db-gateway
    restart: unless-stopped
    depends_on:
      - milvus
    environment:
      GATEWAY_UPSTREAM_BASE_URL: ${GATEWAY_UPSTREAM_BASE_URL:-http://test.sqlgpt.cn/gateway}
      MILVUS_HOST: ${MILVUS_HOST:-milvus}
      MILVUS_PORT: ${MILVUS_PORT:-19530}
      MILVUS_KNOWLEDGE_COLLECTION: ${MILVUS_KNOWLEDGE_COLLECTION:-chat2db_knowledge}
      MILVUS_SCHEMA_COLLECTION: ${MILVUS_SCHEMA_COLLECTION:-chat2db_schema}
      MILVUS_METRIC_TYPE: ${MILVUS_METRIC_TYPE:-COSINE}
      MILVUS_TOP_K: ${MILVUS_TOP_K:-5}
    ports:
      - "${CHAT2DB_GATEWAY_PORT:-18080}:18080"

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ${MILVUS_ETCD_DATA_DIR:-${HOME}/.chat2db-milvus/etcd}:/etcd

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:-minioadmin}
    command: minio server /minio_data
    volumes:
      - ${MILVUS_MINIO_DATA_DIR:-${HOME}/.chat2db-milvus/minio}:/minio_data

  milvus:
    image: milvusdb/milvus:v2.5.10
    container_name: milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    depends_on:
      - milvus-etcd
      - milvus-minio
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "${MILVUS_EXPOSED_PORT:-19530}:19530"
      - "${MILVUS_HTTP_EXPOSED_PORT:-9091}:9091"
    volumes:
      - ${MILVUS_DATA_DIR:-${HOME}/.chat2db-milvus/milvus}:/var/lib/milvus
